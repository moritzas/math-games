<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數學小遊戲</title>
<style>
  :root{
    --paper:#F3E9D7;
    --ink:#33251A;
    --line:#5A4632;
    --red:#A93226;
    --jade:#2E6E5E;
    --card:#FBF3E2;
    --muted:#9c8a6c;
    --shadow:rgba(60,40,20,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    background:var(--paper);
    background-image:radial-gradient(circle at 15% 8%, rgba(255,255,255,.55), transparent 50%),
                     repeating-linear-gradient(90deg, rgba(150,110,60,.04) 0 2px, transparent 2px 26px);
    color:var(--ink);
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
    padding:26px 14px 48px;
  }
  header{text-align:center;margin-bottom:22px}
  h1{
    font-family:"Noto Serif TC","PMingLiU",serif;
    font-size:clamp(30px,7vw,44px);
    letter-spacing:.3em;margin-right:-.3em;
    font-weight:900;
  }
  .subtitle{font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:.12em}

  .grid{
    display:grid;gap:16px;width:min(880px,100%);
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  }
  .card{
    background:var(--card);
    border:2px solid var(--line);
    border-radius:12px;
    padding:18px 18px 16px;
    display:flex;flex-direction:column;gap:10px;
    box-shadow:0 3px 0 var(--shadow);
    text-decoration:none;color:var(--ink);
    transition:transform .1s, box-shadow .1s;
    position:relative;
  }
  a.card:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--shadow)}
  a.card:active{transform:translateY(0);box-shadow:0 2px 0 var(--shadow)}
  a.card:focus-visible{outline:3px solid var(--jade);outline-offset:3px}

  .card h2{
    font-family:"Noto Serif TC",serif;font-weight:900;
    font-size:22px;letter-spacing:.1em;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 svg{width:26px;height:26px;flex:0 0 auto;display:block}
  .card .desc{font-size:14px;line-height:1.8;flex:1}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{
    font-size:12px;padding:2px 9px;border-radius:999px;
    border:1.5px solid var(--jade);color:var(--jade);font-weight:700;
  }
  .go{
    align-self:flex-end;font-weight:700;font-size:14px;color:var(--red);
    letter-spacing:.08em;
  }
  a.card:hover .go::after{content:" →"}

  .card.soon{opacity:.55;box-shadow:none;cursor:default}
  .card.soon .go{color:var(--muted)}

  .empty{
    color:var(--muted);font-size:15px;text-align:center;
    padding:40px 0;grid-column:1/-1;
  }
  footer{margin-top:34px;font-size:12px;color:var(--muted);text-align:center;line-height:1.8}
</style>
</head>
<body>
<header>
  <h1>數學小遊戲</h1>
  <div class="subtitle">動手玩,把數學想清楚</div>
</header>

<div class="grid" id="grid"></div>

<footer>持續上架中</footer>

<script>
"use strict";

/* ── 遊戲清單 ──────────────────────────────────
   上架新遊戲:在下方陣列加一個物件即可,顯示順序就是陣列順序。
   file  :遊戲的 HTML 檔名(同資料夾)
   tags  :2~3 個主題標籤
   status:省略 = 已上架;"soon" = 顯示為即將上架(不可點)
──────────────────────────────────────────────── */
const GAMES = [
  {
    title:"五連方",
    icon:'<svg viewBox="0 0 30 30" aria-hidden="true"><g fill="#2E6E5E"><rect x="10.3" y="0" width="9.4" height="9.4" rx="1.7"/><rect x="20.6" y="0" width="9.4" height="9.4" rx="1.7"/><rect x="0" y="10.3" width="9.4" height="9.4" rx="1.7"/><rect x="10.3" y="10.3" width="9.4" height="9.4" rx="1.7"/><rect x="10.3" y="20.6" width="9.4" height="9.4" rx="1.7"/></g></svg>',
    desc:"十二片五連方,拚長方形、自我複製、圍面積、三組同形四種玩法。",
    tags:["拼圖","密鋪","全等"],
    file:"pentomino.html"
  },
  {
    title:"骨牌方框",
    icon:'<svg viewBox="0 0 32 32" aria-hidden="true"><g transform="rotate(20 16 16)"><rect x="2.5" y="9.25" width="27" height="13.5" rx="2.8" fill="#fff" stroke="#33251A" stroke-width="1.8"/><path d="M16 9.25V22.75" stroke="#33251A" stroke-width="1.5"/><g fill="#33251A"><circle cx="6.4" cy="11.9" r="1.32"/><circle cx="12.1" cy="11.9" r="1.32"/><circle cx="6.4" cy="16" r="1.32"/><circle cx="12.1" cy="16" r="1.32"/><circle cx="6.4" cy="20.1" r="1.32"/><circle cx="12.1" cy="20.1" r="1.32"/><circle cx="19.6" cy="12.3" r="1.32"/><circle cx="22.75" cy="16" r="1.32"/><circle cx="25.9" cy="19.7" r="1.32"/></g></g></svg>',
    desc:"四張骨牌圍一框,四邊點數和相等,另附步步升題本 84 題。",
    tags:["點數和","推理","組合"],
    file:"domino-frames.html"
  },
  {
    title:"稅收遊戲",
    icon:'<svg viewBox="0 0 30 30" aria-hidden="true"><path fill="#A93226" d="M12.6 3L17.4 3L17.4 9.6L21.6 10.4L22.6 26.6L17.2 26.6L17.2 20.6L12.8 20.6L12.8 26.6L7.4 26.6L8.4 10.4L12.6 9.6Z"/></svg>',
    desc:"選一個數留在家中,它的因數全歸皇帝。從因數結構找最佳策略。",
    tags:["因數","策略","博弈"],
    file:"taxman.html"
  },
  {
    title:"馬步收棋",
    icon:"♞",
    desc:"用馬走日的步法收完全盤棋子,五道關卡,最後一關是圖論謎題。",
    tags:["路徑","奇偶性","圖論"],
    file:"knights-tour.html"
  },
  {
    title:"換位跳棋",
    icon:"⇄",
    desc:"用走或跳讓兩邊棋子完全交換,從直線版親手找出 n²+2n 的規律。",
    tags:["找規律","數列","二次關係"],
    file:"frog-leap.html"
  },
  {
    title:"方塊拼圖",
    icon:"▦",
    desc:"把彩色方塊填滿方格盤,不重疊不留空,練習面積拆解與空間推理。",
    tags:["面積","拼貼","空間推理"],
    file:"mondrian-blocks.html"
  },
  {
    title:"點格棋",
    icon:"⬛",
    desc:"輪流在點陣畫線,圍出最多格子獲勝。可對戰 AI,棋盤自訂,支援移除格子。",
    tags:["策略","博弈","組合"],
    file:"dots-and-boxes.html"
  },
  {
    title:"角度時鐘",
    icon:"◷",
    desc:"撥動時針分針,即時顯示夾角,找出重合、垂直、一直線的所有時刻。",
    tags:["角度","時鐘問題","週期"],
    file:"angle-clock.html"
  },
  {
    title:"雙槍約瑟夫",
    icon:'<svg viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="10" fill="none" stroke="#33251A" stroke-width="1.1" opacity=".3"/><g fill="#33251A"><circle cx="25" cy="15" r="1.9"/><circle cx="22.07" cy="22.07" r="1.9"/><circle cx="15" cy="25" r="1.9"/><circle cx="7.93" cy="22.07" r="1.9"/><circle cx="5" cy="15" r="1.9"/></g><circle cx="22.07" cy="7.93" r="2.6" fill="#A93226"/><circle cx="7.93" cy="7.93" r="2.6" fill="#2E6E5E"/><circle cx="15" cy="5" r="2.6" fill="#FBF3E2" stroke="#33251A" stroke-width="1.6"/></svg>',
    desc:"一順一逆兩把槍繞圈點名,另有免死金牌玩法,找出活到最後的位置。",
    tags:["找規律","餘數","對稱"],
    file:"josephus-two-guns.html"
  },
  {
    title:"無和分堆",
    icon:'<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1.4" y="11" width="12.4" height="17.2" rx="2.2" fill="none" stroke="#33251A" stroke-width="1.7"/><rect x="16.2" y="11" width="12.4" height="17.2" rx="2.2" fill="none" stroke="#33251A" stroke-width="1.7"/><g fill="#2E6E5E"><circle cx="5.2" cy="16.2" r="1.6"/><circle cx="10" cy="16.2" r="1.6"/></g><circle cx="7.6" cy="21.6" r="1.6" fill="#A93226"/><circle cx="22.4" cy="4.8" r="2.7" fill="#A93226"/></svg>',
    desc:"數字依序放進框框,誰讓框內冒出兩數相加等於新數就輸。框數與起點都可調。",
    tags:["加法","策略","博弈"],
    file:"sum-boxes.html"
  },
  /* 範例:之後修好的遊戲照這個格式加進來
  {
    title:"遊戲名稱",
    icon:"🎲",
    desc:"一句話介紹玩法與數學重點。",
    tags:["主題一","主題二"],
    file:"檔名.html",
    status:"soon"        // 還沒好就先掛這行,好了再刪
  },
  */
];

const grid=document.getElementById("grid");
if(GAMES.length===0){
  grid.innerHTML='<div class="empty">遊戲整備中,敬請期待!</div>';
}
for(const g of GAMES){
  const soon=g.status==="soon";
  const el=document.createElement(soon?"div":"a");
  el.className="card"+(soon?" soon":"");
  if(!soon) el.href=g.file;
  el.innerHTML=`
    <h2>${g.icon||""} ${g.title}</h2>
    <div class="desc">${g.desc}</div>
    <div class="tags">${(g.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("")}</div>
    <div class="go">${soon?"即將上架":"開始遊戲"}</div>`;
  grid.appendChild(el);
}
</script>
</body>
</html>

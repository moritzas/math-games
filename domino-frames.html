<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骨牌方框</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f6f2; --ink:#1e2536; --ink-soft:#6a7080;
  --line:#d5d2c7; --bone:#fffefb; --edge:#b9b5a8; --pip:#242b3d;
  --ok:#2e7d5b; --ok-bg:#e8f4ee; --warn:#c98a2e; --lock:#3d6d9a;
  --cs:34px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);touch-action:manipulation;
  font-family:"Noto Sans TC","Space Grotesk",system-ui,sans-serif;padding:0 0 24px}
header{padding:14px 16px 4px;max-width:1180px;margin:0 auto}
h1{font-family:"Space Grotesk",sans-serif;font-size:18px;font-weight:700;margin:0}
h1 span{font-weight:400;color:var(--ink-soft);font-size:13px;margin-left:8px}
.controls{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px}
.eyebrow{font-family:"Space Grotesk",sans-serif;font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-right:2px}
button{font-family:inherit;font-size:13px;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s}
button:hover:not(:disabled){background:#f0eee7}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button:disabled{opacity:.35;cursor:not-allowed}
.pill{padding:4px 9px;font-size:12.5px}
.num{font-family:"Space Grotesk",sans-serif;font-weight:700;width:29px;padding:5px 0;text-align:center}
#qIn{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:14px;width:54px;
  text-align:center;padding:5px 4px;border:1px solid var(--line);border-radius:7px;background:#fff}
#info{max-width:1180px;margin:9px auto 0;padding:0 16px;font-size:12.5px;color:var(--ink-soft)}
#info b{color:var(--ink);font-family:"Space Grotesk",sans-serif;font-size:14px}
#info .good{color:var(--ok)}

/* ---------- 盤面 ---------- */
#board{max-width:1180px;margin:14px auto 0;padding:0 16px;
  display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start}
.chain{display:grid;position:relative}
.fbg{border:1.5px dashed var(--line);border-radius:9px;margin:2px;pointer-events:none}
.fbg.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.hole{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;
  place-items:center;pointer-events:none;font-family:"Space Grotesk",sans-serif;
  font-size:calc(var(--cs)*.30);font-weight:700;color:var(--ink-soft);line-height:1}
.hole .s{grid-area:1/2/2/3} .hole .w{grid-area:2/1/3/2}
.hole .e{grid-area:2/3/3/4} .hole .n{grid-area:3/2/4/3}
.hole b{grid-area:2/2/3/3;font-size:calc(var(--cs)*.26);color:#b7b3a6}
.hole .hit{color:var(--ok)} .hole .miss{color:var(--warn)}
.slot{border:1.5px dashed var(--line);border-radius:6px;margin:1.5px;background:rgba(255,255,255,.45)}
.slot.over{border-color:var(--ink);border-style:solid;background:#fff}
.slot.filled{border:none;background:none;margin:0;padding:1.5px}

/* ---------- 骨牌 ---------- */
.dom{display:grid;background:var(--bone);border:1.5px solid var(--edge);border-radius:5px;
  overflow:hidden;position:relative;cursor:grab;width:100%;height:100%;
  box-shadow:0 1px 2px rgba(30,37,54,.1);user-select:none}
.dom.h{grid-template-columns:1fr 1fr} .dom.v{grid-template-rows:1fr 1fr}
.dom.h>.half+.half{border-left:1.5px solid var(--edge)}
.dom.v>.half+.half{border-top:1.5px solid var(--edge)}
.half{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11%}
.half span{border-radius:50%;margin:13%}
.half span.on{background:var(--pip)}
.dom.dead{opacity:.22;cursor:not-allowed;filter:grayscale(1)}
.dom.lock{cursor:default;background:#eef3f8;border-color:var(--lock)}
.dom.lock .half span.on{background:var(--lock)}
.dom.drag{position:fixed;z-index:999;pointer-events:none;opacity:.9;
  box-shadow:0 10px 22px rgba(30,37,54,.3);cursor:grabbing}
.flip{position:absolute;right:0;top:0;width:15px;height:15px;border-radius:0 4px 0 5px;
  background:rgba(30,37,54,.7);color:#fff;font-size:9px;line-height:15px;text-align:center;
  cursor:pointer;z-index:2}

/* ---------- 牌庫 ---------- */
#trayWrap{max-width:1180px;margin:20px auto 0;padding:14px 16px 0;border-top:1px solid var(--line)}
#tray{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;min-height:40px}
#tray .cell{width:calc(var(--cs)*2);height:var(--cs)}
#tray.over{outline:2px dashed var(--ink-soft);outline-offset:6px;border-radius:8px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1 id="title">骨牌方框</h1>
  <div class="controls" id="modeRow">
    <span class="eyebrow">玩法</span>
    <button class="pill" data-m="1">等和方框</button>
    <button class="pill" data-m="2">步步升</button>
  </div>
  <div class="controls" id="ctl"></div>
</header>
<div id="info"></div>
<div id="board"></div>

<div id="trayWrap">
  <span class="eyebrow">牌庫（雙六 28 張）</span>
  <div id="tray"></div>
</div>
<div id="toast"></div>

<script>
const BANK={"1":"6|8|A2:26,B0:41,B2:04,C0:33","2":"6|8|A2:31,B2:42,C0:06,C2:12,D0:52","3":"6|9|A0:41,B0:40,B2:43,C2:42","4":"6|9|A2:42,A3:26,B0:21,C0:06,C2:22","5":"6|10|A4:33,B0:05,B2:13,C0:25","6":"6|10|B0:61,B2:05,B5:60,C0:33,C3:23","7":"6|10|A0:26,A2:42,B0:22","8":"6|10|A1:50,A5:35,B1:51,B3:25,C0:55","9":"6|8|A2:22,B2:40,B5:11,D0:44","10":"6|10|A2:53,B2:26,B4:34,C0:54,D0:61","11":"6|10|A0:52,A3:33,B3:46,C0:55","12":"6|0|A4:13,A5:06,B4:6.,D0:63","13":"6|0|A0:15,A3:12,C0:60","14":"6|0|A0:33,A2:3.,A4:3.,A5:1.,B0:3.,B1:1.,C0:1.,C3:1.","15":"6|9|A0:50,A2:63,A5:33,B5:31","16":"6|8|A2:35,A3:60,A4:12,B2:02,C0:11","17":"6|8|A0:02,A1:23,A2:40,A3:11,B0:60","18":"6|8|A0:3.,A1:34,A5:23,B0:50","19":"6|8|A0:40,A3:12,B0:41,B5:11","20":"6|9|A0:05,A2:52,A4:16,B4:26","21":"6|10|A0:60,A3:53,B1:34,C1:33","22":"6|9|A0:03,A1:04,A4:21,B3:25","23":"6|10|A0:42,A2:52,B2:32","24":"6|9|A0:23,A2:33,B2:34,D0:6.","25":"6|8|A3:15,A5:21,B2:16,C0:14,C2:11","26":"6|0|A0:23,A3:22,C2:52,C3:20,C5:12","27":"6|8|A0:12,B0:53,B2:52,B5:11","28":"6|9|A2:41,A5:51,B2:45,C3:22,D0:43","29":"6|0|A0:61,A3:26,B5:64,C0:06","30":"6|9|B0:15,B2:05,B5:12,C0:03","31":"6|0|A2:50,A5:40,B2:5.,D0:34","32":"6|10|A1:64,A3:22,B0:31","33":"5|6|A1:05,A3:24,B0:60","34":"5|6|A0:12,B0:33","35":"5|6|A0:22,B1:04,C1:32","36":"5|0|A0:33,A3:03,B3:3.,C1:20","37":"5|7|A0:34,A3:04,B0:01,B4:14","38":"5|0|A0:23,A3:25,B0:2.,B4:02,C2:22","39":"5|7|A1:16,A4:13,B0:60,B2:34,C0:11","40":"5|7|A1:61,B0:10,B2:14,C4:21,D0:11","41":"5|7|A2:22,A3:04,C0:06,C2:20,D0:21","42":"5|8|A0:04,A1:26,B0:42,B4:44,C4:20","43":"5|8|A2:31,A4:25,B0:20,B1:05,C3:22,D0:12","44":"5|8|A0:32,B0:30,B3:22,C2:02","45":"5|8|A3:33,B0:11,B1:03,B3:24,D0:22","46":"5|8|A1:62,B0:20,B2:21,B4:24,C4:22","47":"5|9|A0:24,A2:44,C2:32,D0:43","48":"5|9|A2:32,B0:35,B1:42,B3:36,C4:30","49":"5|9|A0:13,A4:33,B1:03,C1:36,C3:23","50":"5|9|B0:21,B1:05,B2:23,C3:33,D0:31","51":"5|9|B2:13,C0:06,C4:61,D0:03","52":"5|10|A3:25,B1:06,C0:24,C2:22,C4:04,D0:14","53":"5|10|B2:26,B4:43,C3:04,D0:52","54":"5|10|A1:64,A3:42,B0:22,B3:44,D0:04","55":"5|10|A0:13,B2:16,B4:33,D0:36","56":"5|10|A0:25,A2:53,A3:40,B0:31","57":"5|11|A0:34,A2:63,A3:44,B3:33","58":"5|0|A0:50,A1:55,A2:54,A3:35,C0:25","59":"5|11|A1:43,B0:52,C3:33,C4:44,D0:55","60":"5|11|A4:44,B1:15,C0:54,C1:55,C4:33","61":"5|12|A3:42,B0:06,C1:33","62":"5|12|A0:25,A4:65,B3:24,D0:55","63":"5|0|A0:44,A1:66,B4:55,C3:33","64":"5|12|A0:43,B1:16,B3:33,C0:35,C4:36","65":"4|6|A0:60,A1:50,B2:04,C3:20","66":"4|6|A1:42,B2:33,C1:31,C3:30,D0:32","67":"4|6|C0:14,C1:51,C2:01,D0:11","68":"4|6|A0:03,A3:00,B1:15,B2:24","69":"4|0|A0:23,A2:21,C1:42,C2:20","70":"4|6|A2:12,B0:20,B1:05,D0:31","71":"4|7|A0:32,B3:13,C1:43,C3:33","72":"4|7|A0:61,A1:52,B1:05,B3:24","73":"4|7|A1:25,A3:12,B0:50,C3:30,D0:15","74":"4|7|A3:11,B0:30,B2:33,D0:21","75":"4|7|A1:40,B2:61,C1:50,C3:15,D0:32","76":"4|0|A0:31,A2:12,B3:11,C0:14,C2:01","77":"4|8|A1:03,A3:23,B3:35,D0:13","78":"4|8|A3:33,B0:02,B1:04,B2:05,D0:32","79":"4|8|A1:26,B3:16,C2:23,C3:31,D0:15","80":"4|8|A0:13,A3:15,B2:16,C0:14,C2:11","81":"4|8|A1:60,A3:33,B3:22,D0:51","82":"4|0|A1:02,A2:22,C1:12,C3:33,D0:05","83":"4|8|A0:61,A2:33,B2:25,B3:23,C0:06","84":"4|8|A2:33,B0:11,B2:23,B3:04,D0:21"};

/* 風車框：3×3 去中心，四張骨牌鋪滿 8 格
     A 橫(0,0)(0,1)  B 直(0,2)(1,2)  C 橫(2,1)(2,2)  D 直(1,0)(2,0)
   每一邊 = 一張完整骨牌 + 隔壁骨牌的一個半邊：
     上 = A + B[0]   右 = B + C[1]   下 = C + D[1]   左 = D + A[0]
   步步升：第 k+1 框的 D 就是第 k 框的 B（整張共用），框心往右上各挪一步 */
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const DOMS=[]; for(let a=0;a<7;a++)for(let b=a;b<7;b++)DOMS.push([a,b]);
const IDX={}; DOMS.forEach((d,i)=>IDX[d[0]+'-'+d[1]]=i);
const tileOf=(x,y)=>IDX[Math.min(x,y)+'-'+Math.max(x,y)];
const MAXF={2:1,3:1,4:2,5:3,6:4,7:4,8:5,9:5,10:5,11:4,12:4,13:3,14:2,15:1,16:1};

const S={mode:1, target:9, q:1, showS:false, placed:{}, given:{}, drag:null};
const $=id=>document.getElementById(id);
const psum=d=>d[0]+d[1];
const usableFor=(d,t)=>psum(d)>=t-6&&psum(d)<=t;
const nFrames=()=>S.mode===1?(MAXF[S.target]||0):cur().n;
function cur(){const [n,s,g]=BANK[S.q].split('|');
  const given={}; if(g) g.split(',').forEach(p=>{const[k,v]=p.split(':');
    given[k]=[v[0]==='.'?null:+v[0], v[1]==='.'?null:+v[1]]});
  return {n:+n, S:+s||null, given};}

/* ---------- 狀態 ---------- */
function load(){
  S.placed={}; S.given={};
  if(S.mode===2){
    const c=cur();
    for(const k in c.given){
      const v=c.given[k];
      if(v[0]!==null&&v[1]!==null) S.given[k]={di:tileOf(v[0],v[1]), flip:v[0]>v[1]};
      else S.given[k]={half:v};              // 只給半邊：當提示，不佔牌
    }
  }
  render();
}
const rec=k=>S.placed[k]||(S.given[k]&&S.given[k].di!==undefined?S.given[k]:null);
const vals=r=>{const d=DOMS[r.di];return r.flip?[d[1],d[0]]:[d[0],d[1]]};
function usedTiles(){const s=new Set();
  for(const k in S.given) if(S.given[k].di!==undefined) s.add(S.given[k].di);
  for(const k in S.placed) s.add(S.placed[k].di); return s;}

/* 第 k 框四個位置的鍵名（步步升的 D 就是上一框的 B） */
function quadKeys(f){
  if(S.mode===1) return {A:f+'A',B:f+'B',C:f+'C',D:f+'D'};
  return {A:'A'+f, B:'B'+f, C:'C'+f, D: f===0?'D0':'B'+(f-1)};
}
function quad(f){const K=quadKeys(f);
  return {A:rec(K.A),B:rec(K.B),C:rec(K.C),D:rec(K.D)};}
const isGiven=k=>!!(S.given[k]&&S.given[k].di!==undefined);
/* 只用玩家看得到的資訊推邊和：優先用「兩張都是題目給的」那一邊，
   推不出來才退而用盤面上任一條已成立的邊。不偷看答案，就不會洩題。 */
function derivedTarget(onlyGiven){
  for(let f=0;f<nFrames();f++){
    const K=quadKeys(f), s=sides(f);
    for(const [side,x,y] of [['n','A','B'],['e','B','C'],['s','C','D'],['w','D','A']]){
      if(s[side]===null) continue;
      if(onlyGiven && !(isGiven(K[x])&&isGiven(K[y]))) continue;
      return s[side];
    }
  }
  return null;
}
function sides(f){
  const {A,B,C,D}=quad(f); const V=r=>r?vals(r):null;
  const a=V(A),b=V(B),c=V(C),d=V(D);
  return {n: a&&b?a[0]+a[1]+b[0]:null, e: b&&c?b[0]+b[1]+c[1]:null,
          s: c&&d?c[0]+c[1]+d[1]:null, w: d&&a?d[0]+d[1]+a[0]:null};
}
function targetNow(){
  if(S.mode===1) return S.target;
  if(S.showS) return cur().S ?? derivedTarget(false);
  return derivedTarget(true) ?? derivedTarget(false);
}
const frameDone=f=>{const t=targetNow(),s=sides(f);
  return t!==null&&['n','e','s','w'].every(k=>s[k]===t)};
function allDone(){
  if(!nFrames())return false;
  for(let f=0;f<nFrames();f++) if(!frameDone(f)) return false;
  return true;
}

/* ---------- 骨牌 DOM ---------- */
function domEl(d,orient,o={}){
  const e=document.createElement('div');
  e.className='dom '+orient+(o.dead?' dead':'')+(o.lock?' lock':'');
  (o.flip?[d[1],d[0]]:[d[0],d[1]]).forEach(v=>{
    const h=document.createElement('div'); h.className='half';
    for(let i=0;i<9;i++){const s=document.createElement('span');
      if(PIPS[v].includes(i)) s.className='on'; h.appendChild(s)}
    e.appendChild(h);
  });
  if(o.flipBtn){const b=document.createElement('div');b.className='flip';b.textContent='⇄';
    b.title='翻轉半邊';
    b.onpointerdown=ev=>{ev.stopPropagation();ev.preventDefault();o.flipBtn()};
    e.appendChild(b)}
  return e;
}

/* ---------- 拖曳 ---------- */
function beginDrag(ev, payload, orient){
  ev.preventDefault();
  const d=DOMS[payload.di];
  const g=domEl(d,orient,{flip:payload.flip});
  g.classList.add('drag');
  const cs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs'));
  g.style.width=(orient==='h'?cs*2:cs)+'px'; g.style.height=(orient==='h'?cs:cs*2)+'px';
  document.body.appendChild(g);
  S.drag={payload, ghost:g, orient, from:payload.from};
  moveGhost(ev);
  window.addEventListener('pointermove',moveGhost);
  window.addEventListener('pointerup',endDrag,{once:true});
}
function moveGhost(ev){
  if(!S.drag)return;
  const g=S.drag.ghost;
  g.style.left=(ev.clientX-g.offsetWidth/2)+'px';
  g.style.top=(ev.clientY-g.offsetHeight/2)+'px';
  document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));
  $('tray').classList.remove('over');
  const t=dropTarget(ev);
  if(t&&t.slot) t.slot.classList.add('over');
  else if(t&&t.tray) $('tray').classList.add('over');
}
function dropTarget(ev){
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  if(!el)return null;
  const slot=el.closest('.slot'); if(slot) return {slot};
  if(el.closest('#trayWrap')) return {tray:true};
  return null;
}
function endDrag(ev){
  window.removeEventListener('pointermove',moveGhost);
  if(!S.drag)return;
  const {payload,from}=S.drag;
  S.drag.ghost.remove();
  const t=dropTarget(ev); S.drag=null;
  document.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));
  $('tray').classList.remove('over');
  if(t&&t.slot){
    const key=t.slot.dataset.k;
    if(S.given[key]&&S.given[key].di!==undefined){toast('這張是題目給的，不能動');return render()}
    const occupant=S.placed[key];
    if(from) delete S.placed[from];
    if(occupant&&from) S.placed[from]={di:occupant.di,flip:occupant.flip};   // 交換
    else if(occupant&&!from){toast('那一格已經有牌了');if(from===undefined){}return render()}
    S.placed[key]={di:payload.di, flip:payload.flip||false};
  }else if(from){
    delete S.placed[from];       // 拖回牌庫
  }
  render();
}

/* ---------- 繪製 ---------- */
function slotEl(key,orient,lock){
  const cell=document.createElement('div');
  cell.className='slot'; cell.dataset.k=key;
  const r=rec(key);
  if(r&&r.di!==undefined){
    cell.classList.add('filled');
    const locked=lock&&S.placed[key]===undefined;
    const e=domEl(DOMS[r.di],orient,{flip:r.flip,lock:locked,
      flipBtn: locked?null:()=>{r.flip=!r.flip;render()}});
    if(!locked) e.onpointerdown=ev=>beginDrag(ev,{di:r.di,flip:r.flip,from:key},orient);
    cell.appendChild(e);
  }else if(S.given[key]&&S.given[key].half){
    const h=S.given[key].half;
    cell.style.cssText+='display:flex;align-items:center;justify-content:center;'
      +'font-family:Space Grotesk;font-size:11px;color:var(--lock);font-weight:700';
    cell.textContent=h.map(x=>x===null?'?':x).join(orient==='h'?' ':'／');
    cell.title='題目只給了半邊提示';
  }
  return cell;
}
function holeEl(f){
  const h=document.createElement('div'); h.className='hole';
  const s=sides(f), t=targetNow();
  [['n','n'],['e','e'],['s','s'],['w','w']].forEach(([k,cls])=>{
    const x=document.createElement('span');
    x.className=cls+(s[k]===null?'':s[k]===t?' hit':' miss');
    x.textContent=s[k]===null?'·':s[k]; h.appendChild(x);
  });
  const b=document.createElement('b'); b.textContent=f+1; h.appendChild(b);
  return h;
}
function render(){
  buildControls();
  const B=$('board'); B.innerHTML='';
  const n=nFrames();
  if(S.mode===1){
    document.documentElement.style.setProperty('--cs','34px');
    for(let f=0;f<n;f++){
      const g=document.createElement('div'); g.className='chain';
      g.style.gridTemplateColumns='repeat(3,var(--cs))';
      g.style.gridTemplateRows='repeat(3,var(--cs))';
      const bg=document.createElement('div');
      bg.className='fbg'+(frameDone(f)?' done':''); bg.style.gridArea='1/1/4/4';
      g.appendChild(bg);
      const put=(el,a)=>{el.style.gridArea=a;g.appendChild(el)};
      put(slotEl(f+'A','h'),'1/1/2/3'); put(slotEl(f+'B','v'),'1/3/3/4');
      put(slotEl(f+'C','h'),'3/2/4/4'); put(slotEl(f+'D','v'),'2/1/4/2');
      put(holeEl(f),'2/2/3/3');
      B.appendChild(g);
    }
  }else{
    const cols=2*n+1, rows=n+2;
    const avail=Math.min(innerWidth,1180)-52;
    document.documentElement.style.setProperty('--cs',
      Math.max(19,Math.min(40,Math.floor(avail/cols)))+'px');
    const g=document.createElement('div'); g.className='chain';
    g.style.gridTemplateColumns=`repeat(${cols},var(--cs))`;
    g.style.gridTemplateRows=`repeat(${rows},var(--cs))`;
    for(let f=0;f<n;f++){
      const r0=n-1-f, c0=2*f;
      const bg=document.createElement('div');
      bg.className='fbg'+(frameDone(f)?' done':'');
      bg.style.gridArea=`${r0+1}/${c0+1}/${r0+4}/${c0+4}`; g.appendChild(bg);
    }
    for(let f=0;f<n;f++){
      const r0=n-1-f, c0=2*f;
      const put=(el,a)=>{el.style.gridArea=a;g.appendChild(el)};
      put(slotEl('A'+f,'h',true),`${r0+1}/${c0+1}/${r0+2}/${c0+3}`);
      put(slotEl('B'+f,'v',true),`${r0+1}/${c0+3}/${r0+3}/${c0+4}`);
      put(slotEl('C'+f,'h',true),`${r0+3}/${c0+2}/${r0+4}/${c0+4}`);
      if(f===0) put(slotEl('D0','v',true),`${r0+2}/${c0+1}/${r0+4}/${c0+2}`);
      put(holeEl(f),`${r0+2}/${c0+2}/${r0+3}/${c0+3}`);
    }
    B.appendChild(g);
  }
  /* 牌庫 */
  const T=$('tray'); T.innerHTML=''; const used=usedTiles(), t=targetNow();
  DOMS.forEach((d,i)=>{
    if(used.has(i))return;
    const dead = t!==null && !usableFor(d,t);
    const cell=document.createElement('div'); cell.className='cell';
    const e=domEl(d,'h',{dead});
    e.title=dead?`點數和 ${psum(d)}，不在 ${t-6}～${t} 之內`
                :`${d[0]}-${d[1]}　點數和 ${psum(d)}`;
    if(dead) e.onpointerdown=ev=>{ev.preventDefault();
      toast(`這張點數和 ${psum(d)}，邊和 ${t} 用不到`)};
    else e.onpointerdown=ev=>beginDrag(ev,{di:i,flip:false},'h');
    cell.appendChild(e); T.appendChild(cell);
  });
  drawInfo();
}
function drawInfo(){
  const n=nFrames(), t=targetNow();
  let done=0; for(let f=0;f<n;f++) if(frameDone(f)) done++;
  if(S.mode===1){
    const u=DOMS.filter(d=>usableFor(d,S.target)).length;
    $('info').innerHTML=`邊和 <b>${S.target}</b>　可用骨牌 <b>${u}</b> 張（其餘 ${28-u} 張反白）　`+
      `理論最多 <b>${n}</b> 框　已完成 <b>${done}</b> 框`+
      (done===n&&n?' <span class="good">🎉 全部排出來了</span>':'');
  }else{
    const c=cur(), u=t!==null?DOMS.filter(d=>usableFor(d,t)).length:28;
    $('info').innerHTML=`第 <b>${S.q}</b> 題　<b>${c.n}</b> 個框、需要 <b>${3*c.n+1}</b> 張　`+
      (t===null ? '邊和 <b>?</b>（還推不出來，先放幾張試試）　'
                : `邊和 <b>${t}</b>${S.showS?'':'（由盤面推得）'}　可用 <b>${u}</b> 張　`)+
      `已完成 <b>${done}</b>/${n} 框`+
      (allDone()?' <span class="good">🎉 通關</span>':'');
  }
}

/* ---------- 控制列 ---------- */
function buildControls(){
  document.querySelectorAll('#modeRow button').forEach(b=>{
    b.classList.toggle('on',+b.dataset.m===S.mode);
    b.onclick=()=>{S.mode=+b.dataset.m;$('ctl').dataset.built='';load()}});
  $('title').innerHTML = S.mode===1
    ? '骨牌方框<span>等和方框：四張圍一框，四邊點數和相等</span>'
    : '骨牌方框<span>步步升：框框相連、共用一張，全部邊和相等</span>';
  const c=$('ctl');
  if(c.dataset.built===String(S.mode)){
    c.querySelectorAll('button[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===S.target));
    const qi=$('qIn'); if(qi)qi.value=S.q;
    const sb=c.querySelector('[data-sh]'); if(sb)sb.classList.toggle('on',S.showS);
    return;
  }
  c.dataset.built=String(S.mode); c.innerHTML='';
  const eb=x=>{const s=document.createElement('span');s.className='eyebrow';s.textContent=x;return s};
  const btn=(x,cls,on,fn,at)=>{const b=document.createElement('button');b.className=cls;
    b.textContent=x; if(on)b.classList.add('on'); if(at)for(const k in at)b.dataset[k]=at[k];
    b.onclick=fn; return b};
  if(S.mode===1){
    c.appendChild(eb('邊和'));
    for(let t=2;t<=16;t++) c.appendChild(btn(t,'num',t===S.target,
      ()=>{S.target=t;S.placed={};render()},{t}));
    c.appendChild(btn('清空','pill',false,()=>{S.placed={};render()}));
  }else{
    c.appendChild(eb('題號'));
    c.appendChild(btn('◀','num',false,()=>{S.q=Math.max(1,S.q-1);load()}));
    const inp=document.createElement('input'); inp.id='qIn'; inp.type='number';
    inp.min=1; inp.max=84; inp.value=S.q;
    const go=()=>{const v=Math.max(1,Math.min(84,parseInt(inp.value,10)||S.q));S.q=v;load()};
    inp.onchange=go; inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
    c.appendChild(inp);
    c.appendChild(btn('▶','num',false,()=>{S.q=Math.min(84,S.q+1);load()}));
    c.appendChild(eb('框數'));
    [[6,1],[5,33],[4,65]].forEach(([nf,first])=>
      c.appendChild(btn(nf+' 框','pill',cur().n===nf,()=>{S.q=first;load()})));
    c.appendChild(btn('顯示邊和','pill',S.showS,()=>{S.showS=!S.showS;render()},{sh:1}));
    c.appendChild(btn('清空','pill',false,()=>{S.placed={};render()}));
  }
}
let tt; function toast(m){const x=$('toast');x.textContent=m;x.className='show';
  clearTimeout(tt);tt=setTimeout(()=>x.className='',2000)}
let rz; addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
load();
</script>
</body>
</html>
